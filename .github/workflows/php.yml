name: OJS Plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ojs-plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3.36', '8.4.27']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, xml, zip

      - name: Show PHP version
        run: php --version

      - name: Check launcher visibility and recovery
        run: |
          node tests/launcher-availability.cjs
          node tests/release-gate.cjs

      - name: Check HTML galley document safety
        run: php tests/html-galley-document.php

      - name: Check installation and upgrade integrity guards
        run: |
          php tests/package-integrity.php
          php tests/incomplete-installation.php
          php tests/incomplete-installation.php mixed

      - name: Build and extract packages using native PHP
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          trap 'rm -rf "$target"' EXIT
          python3 scripts/build-package.py "$target"
          for archive in "$target"/*.tar.gz "$target"/*.zip; do
            php tests/package-extraction.php "$archive"
          done

      - name: Check direct plugin class loading without legacy index
        run: |
          php tests/plugin-class-loading.php
          php tests/plugin-class-loading.php controller

      - name: Check installation path and domain independence
        run: php tests/portable-installation.php

      - name: Check editorial transfer contract
        run: php tests/html-galley-transfer.php

      - name: Check publication artifact provenance
        run: php tests/publication-artifact-document.php

      - name: Check contributor metadata contract
        run: php tests/contributor-metadata-contract.php

      - name: Check workflow file payload validation
        run: php tests/workflow-file-document.php

      - name: Check native revision writeback contract
        run: php tests/revision-writeback-contract.php

      - name: Check scientific, language and translation writeback
        run: php tests/role-writeback.php

      - name: Check native planned issue launcher
        run: php tests/planned-issue-launcher.php

      - name: Check planned issue artifact target contract
        run: php tests/planned-issue-artifact-contract.php

      - name: Check planned issue transfer contract
        run: php tests/planned-issue-transfer-contract.php

      - name: Check publication artifact transfer contract
        run: php tests/publication-artifact-transfer.php

      - name: Check selective metadata reconciliation
        run: php tests/metadata-reconciliation.php

      - name: Check editorial workflow projection
        run: php tests/workflow-snapshot.php

      - name: Lint PHP sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No PHP files found.'
            exit 1
          fi
          printf 'Checking %s PHP files\n' "${#files[@]}"
          for file in "${files[@]}"; do
            php -l "$file"
          done

  package-integrity:
    name: Plugin package integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.27'
          coverage: none
          extensions: xml

      - name: Validate version.xml
        run: |
          php -r '$xml = simplexml_load_file("version.xml"); if ($xml === false) { fwrite(STDERR, "Invalid version.xml\n"); exit(1); } echo "version.xml is valid XML\n";'

      - name: Verify required plugin files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.php
            bootstrap.php
            PackageIntegrity.php
            install.xml
            upgrade.xml
            version.xml
            StudioIntegrationPlugin.php
            StudioIntegrationApiHandler.php
            StudioIntegrationApiController.php
            classes/Adapters/Ojs35Adapter.php
            classes/Middleware/EnsureCompleteInstallation.php
            classes/Core/Base64Url.php
            classes/Core/LaunchToken.php
            classes/Core/ApiResponse.php
            classes/Core/HtmlGalleyDocument.php
            classes/Core/PublicationArtifactDocument.php
            classes/Core/WorkflowFileDocument.php
            classes/Core/WorkflowSnapshot.php
            classes/Core/MetadataReconciliation.php
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file" >&2; exit 1; }
          done

      - name: Reject committed runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.log' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit | grep -q .; then
            echo 'Runtime artifact found in plugin source tree.' >&2
            find . -type f \( -name '*.log' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print
            exit 1
          fi
