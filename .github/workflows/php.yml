name: OJS Plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ojs-plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, xml

      - name: Show PHP version
        run: php --version

      - name: Lint PHP sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No PHP files found.'
            exit 1
          fi
          printf 'Checking %s PHP files\n' "${#files[@]}"
          for file in "${files[@]}"; do
            php -l "$file"
          done

  package-integrity:
    name: Plugin package integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: xml

      - name: Validate version.xml
        run: |
          php -r '$xml = simplexml_load_file("version.xml"); if ($xml === false) { fwrite(STDERR, "Invalid version.xml\n"); exit(1); } echo "version.xml is valid XML\n";'

      - name: Verify required plugin files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.php
            version.xml
            StudioIntegrationPlugin.php
            StudioIntegrationApiHandler.php
            StudioIntegrationApiController.php
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file" >&2; exit 1; }
          done

      - name: Reject committed runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.log' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit | grep -q .; then
            echo 'Runtime artifact found in plugin source tree.' >&2
            find . -type f \( -name '*.log' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print
            exit 1
          fi
